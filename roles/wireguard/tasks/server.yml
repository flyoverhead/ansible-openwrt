---
- name: Set state status for wireguard interface {{ item.id }}
  ansible.builtin.set_fact:
    wireguard_interface_state: "{{ item.state | default('present') }}"

- name: Delete wireguard interface {{ item.id }}
  when: "'absent' in wireguard_interface_state"
  uci:
    command: absent
    config: network
    section: "{{ item.id }}"
    type: interface

- name: Create and configure user-defined wireguard interface
  when: "'present' in wireguard_interface_state"
  block:
    - name: Create wireguard interface {{ item.id }}
      uci:
        command: add
        config: network
        section: "{{ item.id }}"
        type: interface

    - name: Configure user-defined wireguard interface {{ item.id }}
      when: >
        item.private_key is defined and
        item.private_key | length > 0
      uci:
        command: set
        config: network
        section: "{{ item.id }}"
        type: interface
        value:
          proto: "{{ item.proto | default(omit) }}"
          private_key: "{{ item.private_key | default(omit) }}"
          addresses: "{{ item.addresses | default(omit) }}"
          listen_port: "{{ item.listen_port | default(omit) }}"

    - name: Configure new wireguard interface
      when: >
        item.private_key is undefined or
        item.private_key | length == 0
      block:
        - name: Check current wireguard private key
          uci:
            command: get
            config: network
            section: "{{ item.id }}.private_key"
            type: interface
          register: wireguard_current_private_key
          # A key that has never been generated makes `uci get` fail with
          # "Entry not found", which is the expected state on a first run. That
          # message arrives in `msg`; `result` is absent entirely.
          failed_when: >
            wireguard_current_private_key.failed | default(false) and
            'Entry not found' not in wireguard_current_private_key.msg | default('')

        - name: Set current wireguard private key fact
          ansible.builtin.set_fact:
            wireguard_private_key: "{{ wireguard_current_private_key.result }}"
          when: wireguard_current_private_key.result | default('') | length > 0

        - name: Generate wireguard private key  # noqa: inline-env-var
          ansible.builtin.command:
            cmd: umask go= && wg genkey
            uses_shell: true
          register: wireguard_new_private_key
          changed_when: true
          no_log: true
          when: wireguard_current_private_key.result | default('') | length == 0

        - name: Set newly generated wireguard private key fact
          ansible.builtin.set_fact:
            wireguard_private_key: "{{ wireguard_new_private_key.stdout }}"
          when: >
            wireguard_new_private_key.stdout is defined and
            wireguard_new_private_key.stdout | length > 0

        - name: Configure wireguard interface {{ item.id }}
          uci:
            command: set
            config: network
            section: "{{ item.id }}"
            type: interface
            value:
              proto: "{{ item.proto | default(omit) }}"
              private_key: "{{ wireguard_private_key }}"
              addresses: "{{ item.addresses | default(omit) }}"
              listen_port: "{{ item.listen_port | default(omit) }}"

    - name: Configure wireguard peers
      ansible.builtin.include_tasks: peer.yml
      vars:
        wireguard_interface_name: wireguard_{{ item.id }}
        wireguard_interface_addresses: "{{ item.addresses }}"
      loop: "{{ item.peers | default([]) }}"
      loop_control:
        extended: true
        loop_var: wgpeer
