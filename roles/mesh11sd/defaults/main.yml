---
# Default mesh status
mesh11sd_enabled: false

# Enable ath10k-ct drivers fix
# https://openwrt.org/docs/guide-user/network/wifi/mesh/80211s#wireless_hardware_support
mesh11sd_ath10k_ct_fix: false

# Non-mesh wpad packages, removed before the mesh-capable one is installed
mesh11sd_non_mesh_pkgs:
  [
    wpad-mini,
    wpad-basic,
    wpad-basic-wolfssl,
    wpad-basic-openssl,
    wpad-basic-mbedtls,
  ]

# Mesh wpad packages
mesh11sd_pkgs: [wpad-mesh-wolfssl, mesh11sd]

# The two below are empty by default, so the role is a no-op until it is
# configured. The accepted keys are documented in README.md.

# Mesh interface configuration
mesh11sd_interfaces: []

# Mesh interface additional settings
mesh11sd_settings: {}
