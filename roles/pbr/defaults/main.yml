---
# Policy-Based Routing packages
pbr_pkgs: [pbr, luci-app-pbr]

# Dnsmasq-full required version
# pbr needs nftset support, which landed in dnsmasq 2.87 and is only reliable
# from 2.89 onwards
pbr_dnsmasq_full_required_version: "2.89"

# The two below are empty by default, so the role only installs packages until
# it is configured. The accepted keys are documented in README.md.

# PBR service configuration
pbr_service: {}

# PBR policies
pbr_policies: []
