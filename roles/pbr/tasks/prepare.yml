---
- name: Update opkg cache
  ansible.builtin.command:
    cmd: opkg update
  changed_when: false

- name: Install pbr packages
  opkg:
    name: "{{ item }}"
    state: present
  loop: "{{ pbr_pkgs }}"

- name: Check dnsmasq-full installed version  # noqa: inline-env-var
  ansible.builtin.command:
    cmd: "opkg list-installed | grep dnsmasq-full | awk '{print $3}'"  # yamllint disable-line rule:quoted-strings
    uses_shell: true
  register: pbr_dnsmasq_full_installed_version
  changed_when: false
  failed_when: false

- name: Check dnsmasq-full release version  # noqa: inline-env-var
  ansible.builtin.command:
    cmd: "opkg find dnsmasq-full | awk '{print $3}'"  # yamllint disable-line rule:quoted-strings
    uses_shell: true
  register: pbr_dnsmasq_full_release_version
  changed_when: false
  failed_when: false

# Compared with the `version` test rather than `<`, so that 2.90 sorts above
# 2.89 instead of below it the way a plain string comparison would
- name: Install dnsmasq-full release version
  when: >
    (pbr_dnsmasq_full_installed_version.stdout | length == 0 or
    pbr_dnsmasq_full_installed_version.stdout is version(pbr_dnsmasq_full_required_version, '<')) and
    (pbr_dnsmasq_full_release_version.stdout | length > 0 and
    pbr_dnsmasq_full_release_version.stdout is version(pbr_dnsmasq_full_required_version, '>='))
  block:
    - name: Remove dnsmasq-base package
      opkg:
        name: "{{ item }}"
        state: absent
      loop: [dnsmasq, dnsmasq-full]

    - name: Install dnsmasq-full release version
      opkg:
        name: dnsmasq-full
        state: present

- name: Install dnsmasq-full snapshot version
  when: >
    (pbr_dnsmasq_full_installed_version.stdout | length == 0 or
    pbr_dnsmasq_full_installed_version.stdout is version(pbr_dnsmasq_full_required_version, '<')) and
    (pbr_dnsmasq_full_release_version.stdout | length == 0 or
    pbr_dnsmasq_full_release_version.stdout is version(pbr_dnsmasq_full_required_version, '<'))
  block:
    - name: Remove current dnsmasq packages
      opkg:
        name: "{{ item }}"
        state: absent
      loop: [dnsmasq, dnsmasq-full]

    # Install curl for package downloading
    - name: Install curl
      opkg:
        name: curl
        state: present

    - name: Get current package architecture  # noqa: inline-env-var
      ansible.builtin.command:
        cmd: "opkg print-architecture | tail -n 1 | awk '{print $2}'"  # yamllint disable-line rule:quoted-strings
        uses_shell: true
      register: pbr_current_package_architecture
      changed_when: false

    - name: Set snapshot packages facts
      ansible.builtin.set_fact:
        pbr_snapshot_repo_url: https://downloads.openwrt.org/snapshots/packages/{{ pbr_current_package_architecture.stdout }}/base/
        pbr_snapshot_pkgs_list: ["libubox[0-9]", "libubus[0-9]", dnsmasq-full]

    - name: Download and install snapshot packages
      ansible.builtin.include_tasks: snapshot.yml
      loop: "{{ pbr_snapshot_pkgs_list }}"
