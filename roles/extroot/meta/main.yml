---

galaxy_info:
  role_name: extroot
  namespace: flyoverhead
  author: flyoverhead
  description: External root on a USB device, with overlay migration and restore
  license: GPL-3.0-only
  min_ansible_version: '2.16'
  platforms:
    - name: OpenWrt
      versions:
        - '22.03'
        - '23.05'
  galaxy_tags:
    - extroot
    - openwrt
    - storage
    - usb

# Provides the `uci` and `opkg` modules and the action-plugin monkeypatch that
# rewrites `ansible.builtin.*` to shell equivalents. Resolved from `roles/`
# through `roles_path`; see requirements.yml.
dependencies:
  - role: gekmihesg.openwrt
