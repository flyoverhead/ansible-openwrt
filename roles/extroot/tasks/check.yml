---
# Set extroot status to false
# to prevent permanent configuration
- name: Set default extroot status fact to false
  ansible.builtin.set_fact:
    extroot_configure: false

# `uci get` fails with "Entry not found" when fstab has no mount at all, which is
# the state a device is in before extroot has ever been set up -- so only a
# different error is a real failure. The message lands in `msg`, not `result`.
- name: Check current extroot status
  uci:
    command: get
    config: fstab
    section: "@mount[0].target"
    type: mount
  register: extroot_status
  failed_when: >
    extroot_status.failed | default(false) and
    'Entry not found' not in extroot_status.msg | default('')

# No mount, or a mount pointing somewhere other than the target device, means
# extroot still has to be configured
- name: Set extroot status fact
  ansible.builtin.set_fact:
    extroot_configure: true
  when: extroot_device not in extroot_status.result | default('')
