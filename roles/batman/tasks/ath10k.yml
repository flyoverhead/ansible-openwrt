---
# Don't replace current driver until it's not a *-ct one
- name: Set default driver replacement fact to false
  ansible.builtin.set_fact:
    batman_replace_ath10k_ct_driver: false

# Check current driver release
# `grep` exits 1 when nothing matches, which is a valid answer here, not a failure
- name: Check current ath10k firmware release  # noqa: inline-env-var
  ansible.builtin.command:
    cmd: "opkg list-installed | grep ath10k-firmware | awk '{print $1}'"  # yamllint disable-line rule:quoted-strings
    uses_shell: true
  register: batman_ath10k_firmware_current_release
  changed_when: false
  failed_when: false

# Enable reinstall if installed driver contain *-ct postfix
- name: Enable replacement of current driver
  ansible.builtin.set_fact:
    batman_replace_ath10k_ct_driver: true
  when: "'-ct' in batman_ath10k_firmware_current_release.stdout"

# Replace current driver with new one
- name: Replace ath10k-ct firmware and module
  when: batman_replace_ath10k_ct_driver
  block:
    - name: Check current ath10k module release  # noqa: inline-env-var
      ansible.builtin.command:
        cmd: "opkg list-installed | grep kmod-ath10k | awk '{print $1}'"  # yamllint disable-line rule:quoted-strings
        uses_shell: true
      register: batman_ath10k_kmod_current_release
      changed_when: false

    - name: Set current ath10k module release fact
      ansible.builtin.set_fact:
        batman_ath10k_kmod_pkg_name: "{{ batman_ath10k_kmod_current_release.stdout }}"

    - name: Set current driver release name fact
      ansible.builtin.set_fact:
        batman_ath10k_driver_pkg_name: "{{ batman_ath10k_firmware_current_release.stdout }}"

    - name: Remove current driver
      opkg:
        name: "{{ item }}"
        state: absent
      loop: ["{{ batman_ath10k_kmod_pkg_name }}", "{{ batman_ath10k_driver_pkg_name }}"]

    - name: Update opkg cache
      ansible.builtin.command:
        cmd: opkg update
      changed_when: false

    - name: Install new driver
      opkg:
        name: "{{ item }}"
        state: present
      loop:
        [
          "{{ batman_ath10k_kmod_pkg_name | regex_replace('-?ct', '') }}",
          "{{ batman_ath10k_driver_pkg_name | regex_replace('-?ct', '') }}",
        ]
