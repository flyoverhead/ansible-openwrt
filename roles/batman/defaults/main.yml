---
# Default B.A.T.M.A.N. status
batman_enabled: false

# Enable ath10k-ct drivers fix
# https://openwrt.org/docs/guide-user/network/wifi/mesh/80211s#wireless_hardware_support
batman_ath10k_ct_fix: false

# Non-mesh wpad packages, removed before the mesh-capable one is installed
batman_non_mesh_pkgs:
  [
    wpad-mini,
    wpad-basic,
    wpad-basic-wolfssl,
    wpad-basic-openssl,
    wpad-basic-mbedtls,
  ]

# B.A.T.M.A.N. packages
batman_pkgs: [wpad-mesh-wolfssl, kmod-batman-adv, batctl-default]

# Interface definitions are empty by default, so the role is a no-op until it is
# configured. The accepted keys for each entry are documented in README.md.

# B.A.T.M.A.N. network interfaces
batman_network_interfaces: []

# B.A.T.M.A.N. wireless interfaces
batman_wireless_interfaces: []
