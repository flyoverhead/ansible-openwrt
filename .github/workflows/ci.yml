---

name: ci

'on':
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      YAMLLINT_CONFIG_FILE: .config/yamllint.yml # lint configs at the root are gitignored
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ansible-lint==26.9.0 yamllint==1.38.0
          if [ -f requirements.yml ]; then ansible-galaxy collection install -r requirements.yml; fi

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      - name: Build collection
        if: hashFiles('galaxy.yml') != ''
        run: ansible-galaxy collection build --output-path "$RUNNER_TEMP"

      - name: Unit tests
        if: hashFiles('tests/unit/**') != ''
        run: python -m pytest -q tests/unit
